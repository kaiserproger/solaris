[package]
name = "mc-script"
description = "plugin/script API (Luau/WASM) (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
lua-runtime = ["dep:luaur", "dep:mlua", "dep:tempfile", "dep:tracing"]

[dependencies]
# crates.io luaur 0.1.8 hardcodes signed i8 at translated C char boundaries; this exact-release fork carries only the AArch64 c_char portability fix.
luaur = { git = "https://github.com/kaiserproger/luaur.git", rev = "ea648bd95d4948b47dd66e5df62074b5b7ef2ec7", optional = true }
mlua = { workspace = true, optional = true, features = ["serialize"] }
serde = { workspace = true }
# Deterministic resident generation ids and opaque handles are core contract
# derivations, not Lua-runtime-only behavior.
sha2 = { workspace = true }
tempfile = { version = "3", optional = true }
tokio = { workspace = true }
# The rule-plan fingerprint is sha256 over canonical TOML: a core contract
# derivation, not a Lua-runtime-only behavior, for the same reason `sha2` is not
# optional. The component (WASM) path needs it without the Luau host compiled in.
toml = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
