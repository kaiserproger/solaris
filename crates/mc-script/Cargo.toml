[package]
name = "mc-script"
description = "Runtime-independent plugin/script contract (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
# Deterministic resident generation ids, the durable handles derived from them and
# the rule-plan fingerprint (sha256 over canonical TOML) are core contract
# derivations: every consumer, with or without a runtime, must derive them the same
# way, so neither dependency is optional.
sha2 = { workspace = true }
toml = { workspace = true }
# The boundary itself is async: submitting events, waiting for commands and the
# bounded queue that carries both.
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
