[package]
name = "mc-script"
description = "plugin/script API (Luau/WASM) (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
lua-runtime = [
    "dep:luaur",
    "dep:mlua",
    "dep:serde",
    "dep:sha2",
    "dep:tempfile",
    "dep:toml",
    "dep:tracing",
]

[dependencies]
# crates.io luaur 0.1.8 hardcodes signed i8 at translated C char boundaries; this exact-release fork carries only the AArch64 c_char portability fix.
luaur = { git = "https://github.com/kaiserproger/luaur.git", rev = "ea648bd95d4948b47dd66e5df62074b5b7ef2ec7", optional = true }
mlua = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { version = "3", optional = true }
tokio = { workspace = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
