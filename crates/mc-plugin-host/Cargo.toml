[package]
name = "mc-plugin-host"
description = "WASM (Wasmtime) plugin host for Solaris: component loading, bounded callbacks, staging batches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true


[dependencies]
mc-script = { path = "../mc-script" }
mc-data = { path = "../mc-data" }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
# A reload awaits bounded mailbox capacity and its host-owned reply.
tokio = { workspace = true }
wasmtime = { version = "36", default-features = false, features = [
    "std",
    "runtime",
    "component-model",
    "cranelift",
    "parallel-compilation",
] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# The contract-refusal cases build a component for a WIT the host does not
# implement: `dummy-module` generates a core module for any world, and
# `wit-parser` is how that world is spelled out in the test.
wit-component = { version = "0.259", features = ["dummy-module"] }
wit-parser = "0.259"
# Fault injection rewrites only a real guest's canonical cleanup function.
wasm-encoder = { version = "0.259", features = ["wasmparser"] }
wasmparser = "0.259"
