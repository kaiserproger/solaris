[package]
name = "mc-test-harness"
description = "Differential / wire-capture testing infrastructure (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "wire-probe"
path = "src/bin/wire_probe.rs"

[[bin]]
name = "coverage-audit"
path = "src/bin/coverage_audit.rs"

[[bin]]
name = "core-replay-validate"
path = "src/bin/core_replay_validate.rs"

[[bin]]
name = "registry-data-extract"
path = "src/bin/registry_data_extract.rs"

[dependencies]
mc-data = { path = "../mc-data" }
mc-protocol = { path = "../mc-protocol" }
mc-nbt = { path = "../mc-nbt" }
bytes = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[dev-dependencies]
flate2 = { workspace = true }
mc-entity = { path = "../mc-entity" }
mc-net = { path = "../mc-net" }
mc-script = { path = "../mc-script", features = ["lua-runtime"] }
mc-world = { path = "../mc-world" }
mc-worldgen = { path = "../mc-worldgen" }
toml = { workspace = true }
