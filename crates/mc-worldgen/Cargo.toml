[package]
name = "mc-worldgen"
description = "generation pipeline, biomes, structures (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
flate2 = { workspace = true }
mc-data = { path = "../mc-data" }
mc-nbt = { path = "../mc-nbt" }
mc-world = { path = "../mc-world" }
redb = "=3.1.0"
md-5 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
# GPU worldgen experiment only (feature `gpu`); the client pins the same wgpu.
wgpu = { version = "=27.0.1", optional = true }
pollster = { version = "=0.4.0", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# Gated height-context cache counters. Off by default: every increment
# compiles out, so production generation pays nothing.
worldgen-counters = []
# GPU worldgen experiment: chunk density on the GPU (wgpu). Off by default.
gpu = ["dep:wgpu", "dep:pollster"]
