[package]
name = "mc-edge"
description = "Network edge for core model v2 (ADR 0013): I/O threads own sockets, decode off-tick into PlayerInput, fan out TickOutput per viewer (Solaris)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Batched GPU chunk density (`[server] worldgen_gpu`); pulls in wgpu.
gpu = ["mc-worldgen/gpu"]

[[bin]]
name = "solaris-v2"
path = "src/bin/solaris-v2.rs"

[dependencies]
mc-core = { path = "../mc-core" }
mc-vanilla = { path = "../mc-vanilla" }
mc-plugin-host = { path = "../mc-plugin-host" }
mc-script = { path = "../mc-script" }
mc-loader = { path = "../mc-loader" }
mc-data = { path = "../mc-data" }
mc-nbt = { path = "../mc-nbt" }
mc-protocol = { path = "../mc-protocol" }
mc-world = { path = "../mc-world" }
mc-worldgen = { path = "../mc-worldgen" }
anyhow = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }
rustc-hash = { workspace = true }
uuid = { workspace = true }
md-5 = { workspace = true }
aes = { workspace = true }
cfb8 = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
num-bigint = { workspace = true }
rsa = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
zstd = { version = "0.13", default-features = false }
tempfile = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
