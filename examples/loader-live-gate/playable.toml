[server]
name = "solaris-loader-live-gate"
motd = "Solaris Loader two-owner live gate"
view_distance = 4
simulation_distance = 4

[network]
bind_address = "127.0.0.1"
port = 25567

[auth]
online_mode = false
whitelist_enabled = false
whitelist = []
banned_players = []

[admin]
operators = []
allow_local_dev_operators = false

[plugins]
directory = "examples/loader-live-gate/plugins"

[data]
world_dir = ".analysis/loader-live-gate/world"
vanilla_data_dir = "data/vanilla"
seed = 0
worldgen_mode = "tellus_like"

[simulation]
random_tick_speed = 0
save_interval_ticks = 1200
friendly_spawn_interval_ticks = 0
hostile_spawn_interval_ticks = 0

[chunk_pipeline]
chunk_send_rate = 8
chunk_load_rate = 16
chunk_generate_rate = 16
chunk_prepare_budget_ms = 0
chunk_prepare_batch_size = 8
chunk_result_queue_size = 64
region_cache_size = 9

[autoscale]
enabled = false
profile = "balanced"
min_view_distance = 4
max_view_distance = 4
