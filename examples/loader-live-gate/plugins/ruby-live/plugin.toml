id = "ruby-live"
name = "Ruby Loader Live Gate"
version = "1.0.0"
api = "0.7.0"
events = ["player.joined", "player.left"]
player_commands = ["loader_ruby"]

[client]
schema = 2

[[client.bundles]]
id = "rich-content"
version = "1"
artifact = "client/rich-content.zip"
sha256 = "d664fc4dfa8b50edb1e932b5c437978266b546223a945d98c42d79b7a6083b7e"
size_bytes = 1150
loaders = ["fabric", "neoforge", "forge"]
