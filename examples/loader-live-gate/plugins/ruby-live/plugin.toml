id = "ruby-live"
name = "Ruby Loader Live Gate"
version = "1.0.0"
api = "0.7.0"
events = ["player.joined", "player.left"]
player_commands = ["loader_ruby"]

[client]
schema = 2

[[client.bundles]]
id = "rich-content"
version = "1"
artifact = "client/rich-content.zip"
sha256 = "79282123fdc9ada51585deb369dce0bb327b628862b0303facf537dd87949e52"
size_bytes = 1416
loaders = ["fabric", "neoforge", "forge"]
content = ["blocks", "items", "views", "view_actions", "assets"]
permissions = [
  "register_blocks",
  "register_items",
  "present_views",
  "send_view_actions",
  "load_assets",
]
