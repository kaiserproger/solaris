[server]
name = "solaris-alpha"
motd = "Solaris public alpha"
view_distance = 8
simulation_distance = 8

[network]
# Listener IP and TCP port. 0.0.0.0 accepts remote IPv4 connections.
# Use 127.0.0.1 to restrict the server to this machine.
bind_address = "0.0.0.0"
port = 25565

[auth]
# Set true for Mojang session authentication and encrypted public play.
# Offline mode permits public hosting but cannot authenticate player or operator names.
online_mode = false
# When online mode is enabled, include the connecting IP in Mojang's
# hasJoined verification to reject proxying an authenticated session.
prevent_proxy_connections = false
whitelist_enabled = false
# Inline names/UUIDs are merged with the optional JSON profile file on each startup.
whitelist = []
# Relative paths are resolved from this config file's directory. Explicit missing,
# malformed, oversized, or invalid files fail startup and `--check`.
# whitelist_file = "whitelist.json"
# The console `whitelist add|remove` commands write this file (defaulting to
# whitelist.json beside the config) and apply to the next login attempt; no
# restart is needed. Turning enforcement on still requires whitelist_enabled.
banned_players = []
# banned_players_file = "banned-players.json"

[admin]
# OP access is fail-closed by default. Inline names/UUIDs are merged with the
# optional vanilla-style JSON profile file on each startup.
operators = []
# operators_file = "ops.json"
# Console `operator add|remove` writes this file (defaulting to ops.json beside
# the config) and applies immediately to online players and future logins.
# allow_local_dev_operators = true only for throwaway loopback development.
allow_local_dev_operators = false

[dashboard]
# Optional first-party read-only operator dashboard: uptime/version, players,
# TPS/tick latency, memory, autoscale, chunk/entity/spawn counters, save state,
# network pressure, plugin status, and recent warnings. It polls existing
# telemetry and never touches the simulation hot path.
# Disabled by default; binds loopback only. A non-loopback bind additionally
# requires allow_remote = true and stays unauthenticated — prefer a trusted
# reverse proxy for remote access.
enabled = false
bind_address = "127.0.0.1"
port = 8080
# allow_remote = false

[plugins]
# Optional external component package root. Each child directory contains
# plugin.toml, plugin.wasm, optional config.toml, and its declared resources.
directory = "plugins"
# A standalone server has no product roster. Set strict=true and name the exact
# deployed package ids before production startup.
strict = false
# expected = ["my-component"]
#
# [plugins.grants.my-component]
# capabilities = ["storage"]

[data]
# Solaris refuses to mix chunks generated by different revisions, seeds, modes,
# ore/settlement profiles, or geometry.
world_dir = "world"
# Optional vanilla content cache override. Solaris derives its vanilla data
# from your own licensed Minecraft Java installation (a local jar, or a
# launcher-style download from Mojang's public metadata) and never redistributes
# it; the derived cache stays in a gitignored directory. Leave this unset to let
# the server discover or import the cache automatically, or point it at an
# already-derived cache root. Produce one by hand with:
#   mc-server content import --version 26.1.2 --download
# vanilla_data_dir = "data/vanilla"
# World seed for deterministic Solaris generation. Changing it requires a fresh
# world_dir, preventing hard chunk borders between unrelated terrain fields.
seed = 0
# Optional Earth-scale terrain profile. Changing it requires a fresh world_dir.
worldgen_mode = "tellus_like"
# Optional built-in settlement profile, used when no deployed plugin supplies a
# settlement plan. The default "vanilla" generates the five vanilla village
# structures (plains, desert, savanna, snowy, taiga) with their decor from the
# derived content cache; the notice a vanilla village world carries is the
# declared terrain-adaptation analogue, not a missing-village gap.
# "plains_village_prototype" opts into the interim bounded Solaris composite
# (fountain, small house, toolsmith) on the vanilla plains village spacing; it
# attaches no core villages and requires vanilla_data_dir (see
# tools/extract-vanilla-data.sh). A deployed component settlement plan owns
# settlement content instead and suppresses the core lane.
# Changing it requires a fresh world_dir.
# settlement_profile = "plains_village_prototype"

[simulation]
# Random block ticks per active chunk per game tick. Set to 0 to disable
# random block simulation while keeping scheduled ticks enabled.
random_tick_speed = 5
# Autosave cadence in game ticks. The debug manual gate uses a longer cadence
# because large restored entity sets are expensive to serialize every second.
save_interval_ticks = 1200
# Natural friendly-mob attempts: 400 ticks = once every 20 seconds. Set to 0
# to disable only friendly natural spawning.
friendly_spawn_interval_ticks = 400
# Natural hostile-mob attempts: 20 ticks = once per second. Set to 0 to
# disable only hostile natural spawning.
hostile_spawn_interval_ticks = 20
# Natural population caps: 10 ground animals, 20 aquatic mobs (at most 5 water
# creatures such as squid), and 70 hostiles. Ground admission allows two per chunk.
# Spawning considers loaded chunks within 128 blocks, independently of the AI radius.
# Chunks sampled per due attempt. Friendly sampling is intentionally broader
# than hostile sampling so ordinary fauna fills in without multiplying the
# once-per-second hostile workload.
friendly_spawn_chunk_budget = 48
hostile_spawn_chunk_budget = 4

[chunk_pipeline]
# Chunk stream policy. Worker capacity is derived automatically from the
# process CPU limit and is shared by chunk CPU work and entity physics.
chunk_send_rate = 8
chunk_load_rate = 16
chunk_generate_rate = 16
chunk_prepare_budget_ms = 0
chunk_prepare_batch_size = 8
chunk_result_queue_size = 64
region_cache_size = 9
# Optional absolute bound on this pipeline's own worker threads, and on the
# startup chunk bake. Omit it (0) to derive the split from the process CPU
# limit; set it on a small host, or when several servers share one machine, so a
# single server cannot claim every core. It is a cap, not a percentage:
# performance profiles set their own workload knobs and are unaffected.
# worker_threads = 2
# Optional zlib level for compressed protocol frames. Omit for flate2's
# fast default; values above 9 are clamped.
# compression_level = 1

[autoscale]
# Runtime control changes throughput/view and deferred-work budgets only after
# sustained overload or stable headroom for more than a minute, one unit per step.
enabled = true
profile = "balanced"
# Optional overrides. Default view bounds follow server.view_distance.
# min_view_distance = 8
# max_view_distance = 32
# target_tick_ms = 50
# target_first_chunk_ms = 1000
# Seconds, not tick/observation counts; both normalize to a minimum of 60.
# scale_down_after_seconds = 60
# scale_up_after_seconds = 60

[tab_list]
# Optional player-list (tab menu) header and footer shown to every player on
# login. Both default to empty (vanilla default: no header/footer lines).
# TOML basic strings support `\n` escapes for multi-line text.
# header = "Welcome to Solaris"
# footer = "play.example.com"
