[server]
name = "solaris-alpha"
motd = "Solaris public alpha"
view_distance = 8
simulation_distance = 8
# Vanilla `accepts-transfers`: admit players another server transferred here.
accepts_transfers = false
# Vanilla `pause-when-empty-seconds`: with no players online for this many
# seconds the world stops advancing (mobs, weather, redstone, growth). Network,
# console commands and saves keep working; the first join resumes ticking.
# Zero or negative never pauses (vanilla accepts -1).
pause_when_empty_seconds = 60
# Overworld spawn square radius; inactive with an empty ops.json. Operators bypass it.
spawn_protection = 16
# Opt-in per-tick input log (`<world_dir>/input-log/`) for replay from a
# checkpoint. Logs player input as sent (auth commands and locked-session text
# are withheld): treat the files as sensitive. Off by default.
input_log = false
# Overworld chunk density on the GPU, batched across chunk workers. Needs a
# build with `--features gpu` and a hardware adapter; otherwise startup logs
# why and the CPU generates. GPU rounding can flip single blocks where terrain
# density is near zero (0-2 per 36 chunks in tests).
worldgen_gpu = false

[network]
# 0.0.0.0 accepts remote IPv4 connections; use 127.0.0.1 for local play.
bind_address = "0.0.0.0"
port = 25565
# Per-address admission limits; 0 disables each one. A refused connection is
# closed before the handshake.
connection_throttle_ms = 0
max_connections_per_ip = 0

[auth]
# Enable Mojang session authentication for public play.
# Offline mode cannot authenticate player or operator identities.
online_mode = false
# Native session lock: new sessions stay locked (fail closed, invulnerable and
# not targetable; only /register, /login and /changepassword run) until the auth
# plugin calls `unlock_session`. Deploying an auth-capable plugin such as
# `solaris-auth` turns the lock on by itself, even with `false` here; `true`
# additionally refuses startup unless such a plugin is deployed.
require_plugin_login = false

[proxy]
# Upstream proxy trust. `none` accepts direct clients. `velocity` enables
# Velocity modern forwarding: set `secret` to the contents of the proxy's
# forwarding.secret and keep auth.online_mode = false (the proxy
# authenticates players). The forwarded UUID, name, skin and client address
# become the session identity.
mode = "none"
# secret = ""

[dashboard]
# Optional read-only operator dashboard; disabled and loopback-only by default.
enabled = false
bind_address = "127.0.0.1"
port = 8080
# Non-loopback binds additionally require allow_remote = true.
# allow_remote = false

# server.properties beside this TOML is imported at startup if present.
# Explicit TOML keys win. See OPERATING.md for the supported-key table.
# [properties]
# file = "migration/server.properties"

[rcon]
# Plaintext level-four console access. Keep loopback and use an SSH tunnel.
enabled = false
bind_address = "127.0.0.1"
port = 25575
password = ""

[query]
# GameSpy4 UDP Query exposes the player roster on network.bind_address.
enabled = false
port = 25565

[resource_pack]
# Empty URL disables the vanilla Configuration-phase resource pack offer.
url = ""
sha1 = ""
required = false
# prompt = '{"text":"Install this server resource pack."}'
# id = "00000000-0000-3000-8000-000000000001"

[anti_xray]
# Send ores fully enclosed by solid blocks as plain rock until a neighbouring
# block is mined. Both default to true; the End has no ores.
overworld = true
nether = true

[lod]
# Far terrain beyond the view distance for the native Solaris client (vanilla
# clients never see it). The client keeps summaries of every chunk it received
# and asks for tiles beyond its view distance: stored chunks answer with their
# top block (player edits after the last stored image are not shown),
# never-generated columns with the router surface generation will produce.
# Any player can thus see the terrain surface up to max_distance blocks away.
enabled = true
max_distance = 8192
# Per connection tiles queued or in progress, and blocking tile threads in total.
max_inflight_tiles = 4
workers = 1
# Lets the client generate never-generated far terrain on its own GPU instead
# of asking the server. Treat it as revealing the world seed (and with it ore,
# structure and slime-chunk positions) to every native client: the noise
# parameters derive from the seed through a non-cryptographic generator.
share_terrain_keys = false

[distant_horizons]
# Optional Java Distant Horizons protocol 16 (DH 3.3.3/3.3.4).
# Samples actual server chunks; never shares the seed or terrain program.
# Pregenerate the stopped world first; see docs/OPERATING.md.
enabled = false
# Chunk units, not blocks; hard maximum 128.
radius_chunks = 128

[mob_griefing]
# Finer switches under the vanilla `mobGriefing` gamerule, which stays the
# master gate (`/gamerule mob_griefing false` disables all of them). Vanilla
# 26.1.2 has no per-mob gamerules, so these are server configuration. Every
# switch defaults to true (vanilla behaviour).
# A disabled blast still hurts entities; only block damage stops.
creeper_block_damage = true
ghast_block_damage = true
wither_block_damage = true
# Villager crop harvesting and replanting (farmers keep trading and breeding).
villager_farming = true
# Sheared sheep eating grass into dirt; wool still regrows.
sheep_grazing = true

[anti_cheat]
# Token bucket per Play packet id. Set either packet value to 0 to disable it.
packet_rate_per_second = 500
packet_burst = 1000
# Unsupported, non-descending survival movement ticks before correction + kick.
# Set 0 only when another authoritative movement check replaces it.
max_airtime_ticks = 80

[plugins]
# External component packages; each child contains plugin.toml and plugin.wasm.
# Paths resolve against the process working directory.
directory = "plugins"

[data]
# Native world storage. Import stopped Anvil worlds with `world import-anvil`;
# do not point this directory at an existing Anvil world.
world_dir = "world"
# Discover an existing licensed vanilla content cache, or derive one explicitly:
#   solaris-v2 content import --version 26.1.2 --download
# Content is never redistributed. Verify a cache with `content verify`.
# vanilla_data_dir = "data/vanilla"
# Console `backup` copies the running world here (see docs/OPERATING.md).
# backup_dir = "backups"
# Changing the seed requires a fresh world directory.
seed = 0

[voice]
# Proximity voice chat relay for native Solaris clients (ADR 0019). The server
# only forwards Opus packets; it never decodes audio.
enabled = true
range_blocks = 48

[computer]
# Right-click iron blocks with the explicitly enabled Fabric computer client.
# Level-4 operators only. Never expose a privileged host shell.
enabled = false
local_only = true
# Empty = built-in echo. Use a sandboxed, line-oriented agent adapter to opt in:
command = []
# working_directory = "/absolute/sandbox/workspace"
# command = ["/absolute/sandbox-launcher", "/absolute/agent-line-adapter"]
