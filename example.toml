[server]
name = "solaris-test"
motd = "First server powered by Solaris: Innovative Minecraft server engine written in Rust"
view_distance = 8

[network]
bind_address = "0.0.0.0"
port = 25565

[data]
vanilla_dir = "data/vanilla"
world_dir = ".analysis/test-world"
# World seed for deterministic Solaris generation. Chunks already on
# disk in `world_dir` win over fallback generation, so changing this
# affects only missing chunks unless the world is regenerated. Defaults
# to 0 when omitted.
seed = 0

[simulation]
# Random block ticks per active chunk per game tick. Set to 0 to disable
# random block simulation while keeping scheduled ticks enabled.
random_tick_speed = 5
# Maximum active/ticketed chunks sampled per game tick.
random_tick_chunk_budget = 32
# Autosave cadence in game ticks. The debug manual gate uses a longer cadence
# because large restored entity sets are expensive to serialize every second.
save_interval_ticks = 1200

[chunk_pipeline]
# Chunk stream / worker policy. Thread pools are configured as percentages
# of available CPU cores and resolve to at least one thread each.
chunk_send_rate = 8
chunk_load_rate = 16
chunk_generate_rate = 16
chunk_prepare_budget_ms = 0
chunk_prepare_batch_size = 8
chunk_io_threads_percent = 25
chunk_worker_threads_percent = 25
entity_worker_threads_percent = 25
chunk_result_queue_size = 64
region_cache_size = 9
# Optional zlib level for compressed protocol frames. Omit for flate2's
# fast default; values above 9 are clamped.
# compression_level = 1
