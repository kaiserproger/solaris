[server]
name = "solaris-test"
motd = "First server powered by Solaris: Innovative Minecraft server engine written in Rust"
view_distance = 8

[network]
bind_address = "127.0.0.1"
port = 25565

[auth]
# M89 scope: Solaris is offline-mode only. This is suitable for private/local
# MVP testing, not production public authentication. Keep the example bound to
# loopback unless you have an explicit external access plan.
online_mode = false
whitelist_enabled = false
whitelist = []
banned_players = []

[admin]
# OP access is fail-closed by default. Add names or offline UUIDs here, or set
# allow_local_dev_operators = true only for throwaway local development.
operators = []
allow_local_dev_operators = false

[data]
world_dir = ".analysis/test-world"
# Optional local vanilla data sidecar root. When present, Solaris treats the
# sidecar as authoritative and requires registries, tags, reports/block_light.json,
# and supported simple loot. Generate it with tools/extract-vanilla-data.sh.
# vanilla_data_dir = "data/vanilla"
# World seed for deterministic Solaris generation. Chunks already on
# disk in `world_dir` win over fallback generation, so changing this
# affects only missing chunks unless the world is regenerated. Defaults
# to 0 when omitted.
seed = 0
# Optional M51 terrain study mode. Defaults to "vanilla_like" when omitted.
# worldgen_mode = "tellus_like"

[simulation]
# Random block ticks per active chunk per game tick. Set to 0 to disable
# random block simulation while keeping scheduled ticks enabled.
random_tick_speed = 5
# Maximum active/ticketed chunks sampled per game tick.
random_tick_chunk_budget = 32
# Autosave cadence in game ticks. The debug manual gate uses a longer cadence
# because large restored entity sets are expensive to serialize every second.
save_interval_ticks = 1200

[chunk_pipeline]
# Chunk stream / worker policy. Thread pools are configured as percentages
# of available CPU cores and resolve to at least one thread each.
chunk_send_rate = 8
chunk_load_rate = 16
chunk_generate_rate = 16
chunk_prepare_budget_ms = 0
chunk_prepare_batch_size = 8
chunk_io_threads_percent = 25
chunk_worker_threads_percent = 25
entity_worker_threads_percent = 25
chunk_result_queue_size = 64
region_cache_size = 9
# Optional zlib level for compressed protocol frames. Omit for flate2's
# fast default; values above 9 are clamped.
# compression_level = 1

[autoscale]
# Draft M92 runtime-control primitive. The live server does not yet consume
# decisions, so even enabled=true is reported as draft_noop_not_wired by
# --check; --check still renders normalized effective bounds.
enabled = false
profile = "balanced"
# Optional overrides. Omit to use the profile defaults.
# min_view_distance = 6
# max_view_distance = 10
# target_tick_ms = 50
# target_first_chunk_ms = 1500
# scale_down_after_ticks = 3
# scale_up_after_ticks = 10
