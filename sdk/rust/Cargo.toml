[workspace]
resolver = "2"
members = [
    "solaris-plugin-sdk",
    "examples/hello",
    "packages/solaris-permissions",
    "packages/solaris-essentials",
    "packages/solaris-economy",
    "packages/solaris-towns",
    "packages/solaris-audit",
    "packages/solaris-settlements",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
solaris-plugin-sdk = { path = "solaris-plugin-sdk" }
wit-bindgen = "0.62"
toml = "0.8"
