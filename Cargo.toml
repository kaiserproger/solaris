[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["Solaris contributors"]
repository = "https://github.com/kaiserproger/solaris"

[workspace.dependencies]
arc-swap = "1.7"
parking_lot = "0.12"
rustc-hash = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
bytes = "1"
uuid = { version = "1", features = ["serde"] }
# miniz_oxide builds a large deflate state on the caller stack. Chunk frames are
# encoded on 2 MiB runtime workers, so use the bounded-stack pure-Rust backend.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
lz4_flex = "0.11"
md-5 = "0.10"
proptest = "1"
bytemuck = "1"
wide = "1.5"
rayon = "1"
crc32fast = "1"
aes = "0.9"
cfb8 = "0.9"
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
num-bigint = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
same-file = "1"
zip = { version = "8.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The debug server compiles deployed Wasm components at startup. Keep Solaris
# crates debuggable, but optimize every third-party dependency (Wasmtime,
# wasmparser, serde_json, ...): with six deployed packages an unoptimized-deps
# debug server took 64 s to listen, 28 s with `opt-level = 2` on all deps
# (.analysis/codex-logs/restart-hang/). Cranelift lowering and register
# allocation stay at 3. Guest optimization and the host's sequential compile
# policy are unchanged.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

# Density-graph evaluation and noise loops also run during debug-server startup.
# Optimize worldgen while keeping the rest of the development server debuggable.
[profile.dev.package.mc-worldgen]
opt-level = 3

# Lighting/admission runs on the tick thread during join.
[profile.dev.package.mc-world]
opt-level = 3
